[project]
name = "catalog-api"
version = "0.1.0"
description = "API and MCP server for the SchemaScope / NeuroSchema catalogs."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.9",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
