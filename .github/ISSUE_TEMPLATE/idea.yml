name: Suggest an idea
description: A feature, an improvement to the scoring, or a way to collaborate on SchemaScope.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape SchemaScope. You can see what's already planned on the [roadmap](https://schemascope.org/roadmap/).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog and discovery
        - Evaluation and scoring rubric
        - Publication tracking
        - Recommendations
        - Tools for maintainers
        - Website and data access
        - Collaboration or research use
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see, and what problem would it solve?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or context
      description: Resources, papers or tools that show what you mean.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to contribute code or data for this
        - label: I can rate resources in my field (for rubric validation)
