# Production: Caddy (HTTPS) → site server → API (+ MCP) → Postgres. Only Caddy publishes ports (80, 443).
# Secrets come from infrastructure/production/.env (see .env.example); DEV_LOGIN is never enabled here.
#
#   docker compose -f infrastructure/production/docker-compose.yml --env-file infrastructure/production/.env up -d --build
#   # with the recommendation chat's language model (adds ~1–2 GB of memory):
#   docker compose -f infrastructure/production/docker-compose.yml --env-file infrastructure/production/.env --profile llm up -d --build
#   # after each evaluation run (data/ updated by git pull):
#   docker compose -f infrastructure/production/docker-compose.yml --env-file infrastructure/production/.env run --rm ingest
name: schemascope

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?}
  PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (64+ random characters)}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
  SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
  RATE_LIMIT_ANON: ${RATE_LIMIT_ANON:-60}
  RATE_LIMIT_USER: ${RATE_LIMIT_USER:-1000}
  TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8
  MCP_ALLOWED_HOSTS: ${SITE_DOMAIN},api
  CORS_ORIGINS: https://${SITE_DOMAIN}
  # Recommendation chat: a small model on CPU (see the llm service). Without it, chat answers with ranked matches.
  LLM_URL: ${LLM_URL:-http://llm:11434}
  LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
  LLM_THREADS: ${LLM_THREADS:-0}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-180}
  CHAT_RATE_ANON: ${CHAT_RATE_ANON:-6}
  CHAT_RATE_USER: ${CHAT_RATE_USER:-20}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Nightly database dump into BACKUP_DIR on the server (see backup.sh). Test the newest one with:
  #   docker compose -f infrastructure/production/docker-compose.yml --env-file infrastructure/production/.env exec backup backup.sh check
  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_AT: ${BACKUP_AT:-02:45}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-/srv/backups/schemascope}:/backups
    entrypoint: ["sh", "/usr/local/bin/backup.sh", "loop"]
    depends_on: { db: { condition: service_healthy } }

  ingest:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    command: ["python", "-m", "catalog_api.ingest"]
    environment: *api-env
    volumes: ["${DATA_DIR:-../../data}:/app/data:ro"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: always
    environment: *api-env
    volumes: ["${DATA_DIR:-../../data}:/app/data:ro"]
    depends_on:
      db: { condition: service_healthy }
      ingest: { condition: service_completed_successfully }
    command: ["uvicorn", "catalog_api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${API_WORKERS:-1}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile }
    restart: always
    environment:
      API_URL: http://api:8000
      POLL_SECONDS: 60
      CACHE_MB: ${WEB_CACHE_MB:-256}
    depends_on: { api: { condition: service_healthy } }

  # Small language model for the recommendation chat (CPU only). Optional: start with `--profile llm`.
  # One model, one answer at a time, kept in memory for 30 minutes; it downloads the model on first start.
  llm:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: ["llm"]
    restart: always
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 30m
    volumes: [ollama:/root/.ollama]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${LLM_MODEL:-llama3.2:1b} && wait"]
    deploy:
      resources:
        limits: { memory: "${LLM_MEMORY:-2g}" }

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  ollama:
  pgdata:
  caddy_data:
  caddy_config:
